name: PlayerShelter-GSBridge
version: ${mod_version}
main: org.windy.playershelter.gsbridge.PlayerShelterGsBridgePlugin
api-version: '1.21'
description: PlayerShelter/GuildShelter 互操作扩展：玩家获得公会庄园时自动把庇护所建筑迁移过去。
authors: [windy]
# 依赖：
#   PlayerShelter 必装（本扩展全靠它的公开 API，apiVersion >= 7）
#   GuildShelter 可选（缺席时本插件静默待机，不注册任何监听器）
#
# load 语义（Paper 文档，极易写反）：
#   BEFORE = 该依赖【先于】本插件加载 —— 本插件加载时其类已在 classpath 上可用。
#   AFTER  = 该依赖【后于】本插件加载 —— 本插件加载时它还不在。
# 本插件主类一加载就 implements Listener 并引用 PlayerShelterApi / GS 事件类，
# 所以两个依赖都必须是 BEFORE，否则启动即 NoClassDefFoundError。
# join-classpath: true —— 把依赖的类并入本插件类加载器，否则看不见。
dependencies:
  server:
    PlayerShelter: { load: BEFORE, required: true, join-classpath: true }
    GuildShelter:  { load: BEFORE, required: false, join-classpath: true }
