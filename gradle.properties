# Gradle 内存/并行（同 GuildShelter）
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# 注意：不设 org.gradle.java.home，通过 JAVA_HOME 环境变量控制 Gradle JVM 版本。
# paper 侧构建用 Java 21：JAVA_HOME=/home/windy/.gradle/jdks/eclipse_adoptium-21-amd64-linux.2
# neoforge 侧构建用 Java 25：JAVA_HOME=/usr/lib/jvm/zulu-25-amd64

## NeoForge / Minecraft 版本（增强版载体用；混合端 Youer 26.2）
minecraft_version=26.2
minecraft_version_range=[26.2, 27)
neo_version=26.2.0.16-beta
neo_version_range=[26,)
loader_version_range=[4,)

