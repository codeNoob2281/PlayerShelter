pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
    // 项目插件版本集中声明：各模块只写 id 'xxx' 不带版本。
    plugins {
        id 'net.neoforged.gradle.userdev' version '7.1.38'
        id 'com.gradleup.shadow' version '9.0.0'
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'playershelter'

// 一人一世界（个人庇护所）。模块拆分同 GuildShelter：纯核心 + 共享 Paper 胶水 + 每载体一个薄入口。
include 'playershelter-api' // 对外扩展 API（纯接口+DTO+事件，第三方附属 compileOnly）
include 'core'             // domain · service · persistence（平台无关纯 Java）
include 'paper-common'     // adapter/** · 接缝接口+Paper 默认实现 · 抽象引导（禁 net.neoforged）
include 'paper'            // 普通版：纯 Paper 插件 jar
// GuildShelter 互操作扩展（独立扩展 jar）。只有 libs/ 里放了 guildshelter-api-*.jar 才纳入构建，
// 这样「构建插件本体」永远不依赖 GS API（没有该 jar 时 gradle 连这个模块都不认识）。
def gsApiJar = (new File(settingsDir, 'libs').listFiles() ?: []).find {
    it.name.startsWith('guildshelter-api-') && it.name.endsWith('.jar')
}
if (gsApiJar != null) {
    include 'gs-bridge'    // 独立扩展：GuildShelter 自动迁移（依赖 GS API，仅 compileOnly）
}
// Iris 地形扩展（独立扩展 jar）。同理：只有 libs/ 里放了 iris-*.jar 才纳入构建。
def irisJar = (new File(settingsDir, 'libs').listFiles() ?: []).find {
    it.name.startsWith('iris-') && it.name.endsWith('.jar')
}
if (irisJar != null) {
    include 'iris-bridge'  // 独立扩展：Iris 地形生成（依赖 Iris API，仅 compileOnly）
}
// neoforge 载体目录在 .gitignore 里（本地增强版），只在本机存在时纳入构建。
if (file('neoforge_26_2/build.gradle').exists()) {
    include 'neoforge_26_2' // 本地增强版：混合端(NeoForge 26.2)原生接缝 jar
}
if (file('neoforge_1.21.1/build.gradle').exists()) {
    include 'neoforge_1.21.1' // 本地增强版：混合端(NeoForge 1.21.1)原生接缝 jar
}
